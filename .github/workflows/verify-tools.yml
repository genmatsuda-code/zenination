# 道具の頁と、公開面の門番(2026-10-02 新設)
#
# ★ それまで、この地所には CI が一つも無かった。
#   門番を手元でしか回さないなら、忘れた日に黙って通る——「呼ばれない門番は、門番ではない」。
name: verify-tools

on:
  push:
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: '持株の有言実行率(数え方と言い方)'
        run: node tools/verify-yuugen.js
      - name: '同・変異つき(守りを外したら赤になる証明)'
        if: always()
        run: node tools/verify-yuugen.js --mutants
      # ★ 2026-10-05 善意観測所。お金の動きを人に見せる頁なので、間違いの害が大きい。
      #   数を焼き込んでいないか / 読めない日に「最後に読めた」と言うか /
      #   人の名前が出ないか / 値段の語が無いか / 「開示に書かれている」の印に出所が在るか。
      - name: '善意観測所(名札・数の出所・読めない日の言い方)'
        if: always()
        run: node tools/verify-kansokujo.js
      - name: '同・変異つき(守りを外したら赤になる証明)'
        if: always()
        run: node tools/verify-kansokujo.js --mutants
      - name: '棚から善意観測所へ行けるか'
        if: always()
        run: |
          grep -q 'kansokujo.html' dougu.html || { echo '::error::棚から善意観測所へ行けない'; exit 1; }
          echo '道は在る'

  # ★ 2026-10-05 新設。上の門番は**偽のチェーンの上で緑**だったのに、本番を本物のブラウザで開くと
  #   NYAN の段が全部「読めませんでした」だった(ブラウザからの Solana の公開 RPC が 403)。
  #   **門番が通っていない道が在った。** だからここで、本物のブラウザで本番の頁を開いて、
  #   数字が出ていることを見る。playwright は、この仕事の中にだけ置く。
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: '本物のブラウザ(375 幅)で本番を開き、数字が出るか'
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const b = await chromium.launch();
              const p = await b.newPage({ viewport: { width: 375, height: 812 } });
              const errs = [];
              p.on("pageerror", e => errs.push(String(e.message).slice(0, 120)));
              await p.goto("https://genmatsuda-code.github.io/zenination/kansokujo.html", { waitUntil: "networkidle", timeout: 60000 });
              await p.waitForTimeout(6000);
              const sup = (await p.textContent("#nyanSupply")) || "";
              const cards = (await p.textContent("#nyanCards")) || "";
              const wwb = (await p.textContent("#wwbSupply")) || "";
              const asof = (await p.textContent("#asof")) || "";
              await p.screenshot({ path: "kansokujo-375.png", fullPage: true });
              await b.close();
              console.log("総数(NYAN): " + sup.trim());
              console.log("総数(WWB): " + wwb.trim());
              console.log("時刻: " + asof.trim().slice(0, 90));
              const digits = /[0-9]{1,3}(,[0-9]{3})+/;
              const bad = [];
              if (!digits.test(sup)) bad.push("NYAN の総数が数で出ていない");
              if (!digits.test(cards)) bad.push("NYAN の財布の枚数が一つも数で出ていない");
              if (!digits.test(wwb)) bad.push("WWB の総数が数で出ていない");
              if (/undefined|NaN|Invalid/.test(asof)) bad.push("時刻の行に意味の無い語が出ている");
              if (errs.length) bad.push("頁の中で落ちた: " + errs[0]);
              if (bad.length) { console.log("::error::" + bad.join(" / ")); process.exit(1); }
              console.log("本物のブラウザで、数字が出ています");
            })();
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kansokujo-375
          path: kansokujo-375.png

      - name: '棚と実物が食い違っていないか(押させてから断らない)'
        if: always()
        run: |
          grep -q 'yuugen.html' dougu.html || { echo '::error::棚から道具へ行けない'; exit 1; }
          # ★的はその道具の行だけ。頁の他の場所の言及まで赤にすると、正しい文まで直させることになる
          if grep -A3 'yuugen.html' dougu.html | grep -q '証券コード'; then
            echo '::error::棚の道具の行がまだ「証券コード」と言っている(実物は 開示の文を貼る)'
            exit 1
          fi
          echo '棚と実物が揃っている'

  # ★2026-10-02: 佐藤が `git add -A` で、他の席の**未公開の下書き**と
  #   OneDrive の競合コピー 2 本を、この公開面へ出した(同日に別の席が外した)。
  #   .gitignore で add は物理的に塞いだが、別の名前で入る道は残る。
  #   だから**出た事を、出た日に知る**。
  leak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: '公開面に、競合コピーが混ざっていないか'
        run: |
          HIT=$(git ls-files | grep -iE -- '-DESKTOP-|-デスクトップ-' || true)
          if [ -n "$HIT" ]; then
            echo "::error::OneDrive の競合コピーが公開面に在る"
            echo "$HIT"
            exit 1
          fi
          echo '競合コピー 0 本'
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # ★置き換え(2026-10-02): 前は `for F in yuugen.html` の**決め打ち**だった。
      #   それでは、出た下書き(どこからも辿れない頁)を一本も捕まえられない
      #   ——漏れたのは、まさにそういう頁だった。§6「的を決め打ちの一覧にしない・数え直す」。
      - name: 'どこからも辿れない頁が増えていないか(漏れの一番 分かりやすい形)'
        run: node tools/verify-no-orphan.js
      - name: '同・変異つき(下書きが増えたら赤になる証明)'
        if: always()
        run: node tools/verify-no-orphan.js --mutants
      - name: '(旧)棚から道具へ行けるか'
        run: |
          MISS=0
          if ! grep -q 'yuugen.html' dougu.html; then
            echo "::error::棚から道具へ行けない"
            MISS=1
          fi
          [ "$MISS" = "0" ] || exit 1
          echo '道は在る'
